[project]
name = "flab-decode-jackpot"
version = "0.1.0"
description = "Educational analysis of Philippine PCSO lottery draw results"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.0",
    "filelock>=4.2.9",
    "flask>=3.1.2",
    "flask-limiter[redis]>=4.1.1",
    "numpy>=2.3.4",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.1.1",
    "selenium>=4.36.0",
    "webdriver-manager>=4.0.2",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["app.py", "app", "scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
