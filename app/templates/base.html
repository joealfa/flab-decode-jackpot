<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="Explore historical Philippine PCSO lottery results, statistical summaries, and draw comparisons. Lottery draws are random.">
        <meta name="keywords"
              content="PCSO, lotto, lottery, analysis, Philippines, predictions, statistics">
        <title>
            {% block title %}Fortune Lab - Decoding the Jackpot{% endblock %}
        </title>
        <link rel="icon"
              type="image/svg+xml"
              href="{{ url_for('static', filename='favicon.svg') }}">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/style.css') }}">
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        <nav class="navbar">
            <div class="container">
                <div class="navbar-brand">
                    <i class="fas fa-dice"></i>
                    <span>Fortune Lab</span>
                </div>
                <div class="navbar-menu">
                    <a href="{{ url_for("index") }}" class="nav-link">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="{{ url_for("accuracy_dashboard") }}" class="nav-link">
                        <i class="fas fa-bullseye"></i> Accuracy
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-chart-line"></i> Analytics
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-info-circle"></i> About
                    </a>
                </div>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer class="footer">
            <div class="container">
                <p>© 2025 Fortune Lab. Decoding the Jackpot.</p>
                <p class="disclaimer">For entertainment purposes only. Past results do not guarantee future outcomes.</p>
            </div>
        </footer>
        <div id="alertModal"
             class="alert-modal-backdrop d-none"
             onclick="closeAlertModal(event)">
            <div class="alert-modal">
                <div class="alert-modal-icon" id="alertModalIcon">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="alert-modal-body">
                    <h3 class="alert-modal-title" id="alertModalTitle">Notice</h3>
                    <p class="alert-modal-message" id="alertModalMessage"></p>
                </div>
                <button class="alert-modal-btn" onclick="closeAlertModal()">OK</button>
            </div>
        </div>
        <!-- Chart.js - Using stable version 3.9.1 for better compatibility -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0/dist/chartjs-plugin-annotation.min.js"></script>
        <script src="{{ url_for('static', filename='js/chart-optimizer.js') }}"></script>
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        {% block extra_js %}
        {% endblock %}
    </body>
</html>
