name: Quality

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --dev
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check app.py app tests scripts
      - run: uv run --locked pyright